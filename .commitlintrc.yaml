extends:
  - "@commitlint/config-conventional"
rules:
  # Allowed types (same set ruff lint already enforces via commit convention)
  type-enum:
    - 2
    - always
    - [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]
  # Keep subject concise but not empty
  subject-empty:
    - 2
    - never
  subject-case:
    - 0  # allow any case (e.g. capitalised sentences)

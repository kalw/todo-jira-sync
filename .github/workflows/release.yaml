name: Release

# Triggered by every push to main.
# release-please maintains a "Release PR"; merging it causes this workflow to:
#   1. Create the vX.Y.Z tag + GitHub Release
#   2. Append artifact links to the release body
#   3. Publish to PyPI  (via reusable publish-pypi.yaml — keeps job_workflow_ref correct)
#   4. Push to GHCR     (inline — no OIDC issuer constraint from registries)
#
# Auto-release: when release-please opens the Release PR, a step immediately
# merges it (release PRs only touch version.txt + CHANGELOG) and then
# explicitly dispatches this workflow on main via workflow_dispatch.
# This sidesteps GitHub's GITHUB_TOKEN anti-loop rule, which would otherwise
# prevent the push event from firing when the merge is done by GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual re-run and self-dispatch after Release PR merge

permissions: {}

jobs:
  # --------------------------------------------------------------------------
  # 1. release-please: open/update the Release PR; on merge → tag + release.
  # --------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
      pr:              ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

      # Merge the Release PR and re-dispatch this workflow on main.
      #
      # Why re-dispatch?  GitHub blocks workflows from being re-triggered when
      # a merge is performed by GITHUB_TOKEN (anti-loop protection).  So the
      # push that lands `chore(main): release X.Y.Z` on main would normally
      # be invisible to push-event listeners.  We work around this by
      # explicitly dispatching the workflow after the merge completes.
      #
      # --squash without --auto merges immediately; release PRs only touch
      # version.txt and CHANGELOG.md so no CI gate is needed.  We poll briefly
      # to confirm GitHub has recorded the merge before dispatching.
      - name: Merge Release PR and re-dispatch release workflow
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          pr_number=$(echo "$PR_JSON" | jq -r '.number')
          gh pr merge "$pr_number" \
            --repo "${{ github.repository }}" \
            --squash

          # Wait until the PR is confirmed merged (usually instant, cap at 5 min)
          for i in $(seq 1 60); do
            state=$(gh pr view "$pr_number" \
              --repo "${{ github.repository }}" \
              --json state -q '.state')
            [ "$state" = "MERGED" ] && break
            sleep 5
          done

          # Dispatch release.yaml on main so release-please can detect the
          # release commit and create the tag + GitHub Release.
          gh workflow run release.yaml \
            --repo "${{ github.repository }}" \
            --ref main

  # --------------------------------------------------------------------------
  # 2. annotate: append Docker / PyPI artifact links to the release body.
  # --------------------------------------------------------------------------
  annotate:
    name: Append artifact links
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG:  ${{ needs.release-please.outputs.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add Docker & PyPI links to release notes
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          tag     = os.environ["TAG"]
          repo    = os.environ["REPO"]
          version = tag.lstrip("v")
          package = "todo-jira-sync"
          image   = f"ghcr.io/{repo}"

          addendum = "\n".join([
              "",
              "---",
              "",
              "## \U0001f4e6 Artifacts",
              "",
              "### \U0001f40d PyPI",
              "",
              "```bash",
              f"pip install {package}=={version}",
              "# or with uv",
              f"uv add {package}=={version}",
              "```",
              "",
              f"\U0001f4e6 <https://pypi.org/project/{package}/{version}/>",
              "",
              "### \U0001f433 Docker (GitHub Container Registry)",
              "",
              "```bash",
              "docker run --rm \\",
              "  --env-file .env \\",
              '  -v "$(pwd):/work" \\',
              f"  {image}:{version} \\",
              "  sync --help",
              "```",
              "",
              f"\U0001f3f7️ `{image}:{version}`",
          ])

          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo,
               "--json", "body", "-q", ".body"],
              capture_output=True, text=True, check=True,
          )
          body = result.stdout.strip() + addendum

          with open("/tmp/release_body.md", "w") as fh:
              fh.write(body)

          subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo,
               "--notes-file", "/tmp/release_body.md"],
              check=True,
          )
          PYEOF

  # --------------------------------------------------------------------------
  # 3. publish-pypi: delegate to the reusable workflow.
  #    Using `uses:` sets job_workflow_ref → publish-pypi.yaml in the OIDC
  #    token, which is what the PyPI Trusted Publisher config expects.
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: ./.github/workflows/publish-pypi.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # --------------------------------------------------------------------------
  # 4. publish-docker: build multi-arch image and push to GHCR.
  # --------------------------------------------------------------------------
  publish-docker:
    name: Publish container
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docker
      url: https://ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Strip v prefix from tag
        id: version
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SLSA attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Release

# Runs on every push to main. release-please maintains a "Release PR" that
# accumulates conventional commits; merging it creates the tag + GitHub Release,
# which then triggers the publish-docker and publish-pypi workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write      # create tags and releases
  pull-requests: write # open / update the Release PR

jobs:
  # --------------------------------------------------------------------------
  # 1. release-please: maintain the Release PR and, when merged, tag + release.
  # --------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # "simple" manages CHANGELOG.md and version.txt without touching
          # pyproject.toml, so setuptools-scm keeps reading the version from
          # the git tag that release-please just created.
          release-type: simple

  # --------------------------------------------------------------------------
  # 2. annotate: append Docker / PyPI artifact links to the new release body.
  # --------------------------------------------------------------------------
  annotate:
    name: Append artifact links
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add Docker & PyPI links to release notes
        # The Python script is built from a list of strings to avoid placing
        # raw Markdown (---, ##, ```) at column-0 inside the YAML literal block,
        # which would prematurely terminate the block scalar.
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          tag     = os.environ["TAG"]
          repo    = os.environ["REPO"]
          version = tag.lstrip("v")
          package = "todo-jira-sync"
          image   = f"ghcr.io/{repo}"

          addendum = "\n".join([
              "",
              "---",
              "",
              "## \U0001f4e6 Artifacts",
              "",
              "### \U0001f40d PyPI",
              "",
              "```bash",
              f"pip install {package}=={version}",
              "# or with uv",
              f"uv add {package}=={version}",
              "```",
              "",
              f"\U0001f4e6 <https://pypi.org/project/{package}/{version}/>",
              "",
              "### \U0001f433 Docker (GitHub Container Registry)",
              "",
              "```bash",
              "docker run --rm \\",
              "  --env-file .env \\",
              '  -v "$(pwd):/work" \\',
              f"  {image}:{version} \\",
              "  sync --help",
              "```",
              "",
              f"\U0001f3f7️ `{image}:{version}`",
          ])

          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo,
               "--json", "body", "-q", ".body"],
              capture_output=True, text=True, check=True,
          )
          body = result.stdout.strip() + addendum

          with open("/tmp/release_body.md", "w") as fh:
              fh.write(body)

          subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo,
               "--notes-file", "/tmp/release_body.md"],
              check=True,
          )
          PYEOF

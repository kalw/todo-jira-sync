name: Release

# Triggered by every push to main.
# release-please maintains a "Release PR"; merging it causes this workflow to:
#   1. Create the vX.Y.Z tag + GitHub Release
#   2. Append artifact links to the release body
#   3. Publish to PyPI  (same workflow — avoids GITHUB_TOKEN trigger restriction)
#   4. Push to GHCR     (same workflow — avoids GITHUB_TOKEN trigger restriction)
#
# NOTE: publish-pypi.yaml and publish-docker.yaml exist only as manual
# re-trigger targets (workflow_dispatch). Do NOT add push/release triggers
# to them — tags created by GITHUB_TOKEN do not fire push/release events in
# other workflows.
on:
  push:
    branches: [main]

# Workflow-level defaults (release-please needs contents+PR write).
# Publish jobs override these with their own narrower permission sets.
permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. release-please: open/update the Release PR; on merge → tag + release.
  # --------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

  # --------------------------------------------------------------------------
  # 2. annotate: append Docker / PyPI artifact links to the release body.
  # --------------------------------------------------------------------------
  annotate:
    name: Append artifact links
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG:  ${{ needs.release-please.outputs.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add Docker & PyPI links to release notes
        # Built as a list of strings — raw Markdown tokens at column-0 would
        # terminate the YAML literal block prematurely.
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          tag     = os.environ["TAG"]
          repo    = os.environ["REPO"]
          version = tag.lstrip("v")
          package = "todo-jira-sync"
          image   = f"ghcr.io/{repo}"

          addendum = "\n".join([
              "",
              "---",
              "",
              "## \U0001f4e6 Artifacts",
              "",
              "### \U0001f40d PyPI",
              "",
              "```bash",
              f"pip install {package}=={version}",
              "# or with uv",
              f"uv add {package}=={version}",
              "```",
              "",
              f"\U0001f4e6 <https://pypi.org/project/{package}/{version}/>",
              "",
              "### \U0001f433 Docker (GitHub Container Registry)",
              "",
              "```bash",
              "docker run --rm \\",
              "  --env-file .env \\",
              '  -v "$(pwd):/work" \\',
              f"  {image}:{version} \\",
              "  sync --help",
              "```",
              "",
              f"\U0001f3f7️ `{image}:{version}`",
          ])

          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo,
               "--json", "body", "-q", ".body"],
              capture_output=True, text=True, check=True,
          )
          body = result.stdout.strip() + addendum

          with open("/tmp/release_body.md", "w") as fh:
              fh.write(body)

          subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo,
               "--notes-file", "/tmp/release_body.md"],
              check=True,
          )
          PYEOF

  # --------------------------------------------------------------------------
  # 3. publish-pypi: build sdist + wheel and upload to PyPI via OIDC.
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/todo-jira-sync/
    permissions:
      id-token: write    # OIDC token for PyPI Trusted Publishing
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0  # setuptools-scm needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Generate SLSA attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # --------------------------------------------------------------------------
  # 4. publish-docker: build multi-arch image and push to GHCR.
  # --------------------------------------------------------------------------
  publish-docker:
    name: Publish container
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docker
      url: https://ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Strip v prefix from tag
        id: version
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SLSA attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

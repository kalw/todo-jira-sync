name: Release

# Triggered by every push to main.
# release-please maintains a "Release PR"; when one is detected this workflow:
#   1. Merges the Release PR immediately (no CI gate needed — it only touches
#      version.txt + CHANGELOG.md)
#   2. Creates the vX.Y.Z git tag + GitHub Release via `gh release create`
#   3. Appends Docker / PyPI artifact links to the release body (annotate job)
#   4. Publishes to PyPI  (via reusable publish-pypi.yaml — keeps job_workflow_ref)
#   5. Builds and pushes the multi-arch Docker image to GHCR
#
# Everything runs in a single workflow execution — no self-dispatch needed.
# The two-run approach (merge PR → dispatch → release-please detects merge) was
# abandoned because dispatch-triggered runs fail with "Bad credentials" during
# release-please's commit-history backfill phase.  Instead, we extract the
# version from the Release PR title and call `gh release create` ourselves.
on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual re-runs

permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. release-please: open/update the Release PR; when one is found, merge it
  #    immediately and create the tag + GitHub Release in the same run.
  # --------------------------------------------------------------------------
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.merge_and_release.outputs.release_created || 'false' }}
      tag_name:        ${{ steps.merge_and_release.outputs.tag_name || '' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          # release-please's own release-creation REST call consistently returns
          # 403 "Resource not accessible by integration" on this repo, even with
          # contents:write.  We skip it and create the tag + release ourselves.
          skip-github-release: true

      # When release-please opens or updates a Release PR, merge it immediately
      # and create the git tag + GitHub Release in the same workflow run.
      #
      # Why not use the two-run (self-dispatch) approach?
      # Dispatch-triggered runs fail with "Bad credentials" during release-please's
      # commit-history backfill phase.  Doing it all in one run avoids this.
      #
      # Version is parsed from the PR title: "chore(main): release X.Y.Z".
      - name: Merge Release PR and create release
        id: merge_and_release
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          pr_number=$(echo "$PR_JSON" | jq -r '.number')

          # Extract version from PR title: "chore(main): release X.Y.Z"
          pr_title=$(echo "$PR_JSON" | jq -r '.title')
          version=$(echo "$pr_title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tag="v${version}"

          # Merge the Release PR (squash — it only touches version.txt + CHANGELOG).
          gh pr merge "$pr_number" \
            --repo "${{ github.repository }}" \
            --squash

          # Wait until GitHub confirms the merge (usually instant, cap at 5 min).
          for i in $(seq 1 60); do
            state=$(gh pr view "$pr_number" \
              --repo "${{ github.repository }}" \
              --json state -q '.state')
            [ "$state" = "MERGED" ] && break
            sleep 5
          done

          # Swap the release-please label so the next run doesn't abort with
          # "untagged merged release PRs outstanding".
          gh pr edit "$pr_number" \
            --repo "${{ github.repository }}" \
            --remove-label "autorelease: pending" \
            --add-label "autorelease: tagged"

          # Create the git tag and GitHub Release.
          # No --target: defaults to the default branch HEAD, which is now the
          # release merge commit (the loop above confirmed the merge).
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes

          echo "release_created=true"  >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag"         >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 2. annotate: append Docker / PyPI artifact links to the release body.
  # --------------------------------------------------------------------------
  annotate:
    name: Append artifact links
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG:  ${{ needs.release-please.outputs.tag_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add Docker & PyPI links to release notes
        run: |
          python3 - << 'PYEOF'
          import os, subprocess

          tag     = os.environ["TAG"]
          repo    = os.environ["REPO"]
          version = tag.lstrip("v")
          package = "todo-jira-sync"
          image   = f"ghcr.io/{repo}"

          addendum = "\n".join([
              "",
              "---",
              "",
              "## \U0001f4e6 Artifacts",
              "",
              "### \U0001f40d PyPI",
              "",
              "```bash",
              f"pip install {package}=={version}",
              "# or with uv",
              f"uv add {package}=={version}",
              "```",
              "",
              f"\U0001f4e6 <https://pypi.org/project/{package}/{version}/>",
              "",
              "### \U0001f433 Docker (GitHub Container Registry)",
              "",
              "```bash",
              "docker run --rm \\",
              "  --env-file .env \\",
              '  -v "$(pwd):/work" \\',
              f"  {image}:{version} \\",
              "  sync --help",
              "```",
              "",
              f"\U0001f3f7️ `{image}:{version}`",
          ])

          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo,
               "--json", "body", "-q", ".body"],
              capture_output=True, text=True, check=True,
          )
          body = result.stdout.strip() + addendum

          with open("/tmp/release_body.md", "w") as fh:
              fh.write(body)

          subprocess.run(
              ["gh", "release", "edit", tag, "--repo", repo,
               "--notes-file", "/tmp/release_body.md"],
              check=True,
          )
          PYEOF

  # --------------------------------------------------------------------------
  # 3. publish-pypi: delegate to the reusable workflow.
  #    Using `uses:` sets job_workflow_ref → publish-pypi.yaml in the OIDC
  #    token, which is what the PyPI Trusted Publisher config expects.
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: ./.github/workflows/publish-pypi.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # --------------------------------------------------------------------------
  # 4. publish-docker: build multi-arch image and push to GHCR.
  # --------------------------------------------------------------------------
  publish-docker:
    name: Publish container
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: docker
      url: https://ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Strip v prefix from tag
        id: version
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SLSA attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Publish to PyPI

# Triggered automatically when release-please creates a vX.Y.Z tag.
# Can also be triggered manually to re-publish a specific tag (e.g. after
# configuring PyPI Trusted Publishing for the first time).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Defaults to the workflow ref."
        required: false
        type: string

# ---------------------------------------------------------------------------
# One-time setup required before this workflow can publish:
#
# 1. GitHub: Settings → Environments → New environment → name it "pypi".
#    (No approval gates needed; the environment just scopes the OIDC token.)
#
# 2. PyPI Trusted Publisher (no API token required):
#    https://pypi.org/manage/account/publishing/
#    Fill in:
#      • PyPI project name : todo-jira-sync
#      • Owner             : kalw
#      • Repository        : todo-jira-sync
#      • Workflow filename  : publish-pypi.yaml
#      • Environment       : pypi
# ---------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the manually-supplied tag when dispatched by hand,
          # otherwise let the default ref (the pushed tag) apply.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # setuptools-scm needs the full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi       # must match the environment name in the PyPI Trusted Publisher
      url: https://pypi.org/project/todo-jira-sync/
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate SLSA attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
